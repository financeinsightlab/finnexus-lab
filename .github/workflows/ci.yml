name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Placeholder values so Prisma/Next can run without real secrets. No test
      # or build step in this job connects to a live database.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci?sslmode=disable
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/ci?sslmode=disable
      AUTH_SECRET: ci-placeholder-secret
      AUTH_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
