<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="auto-bg" x1="0" y1="0" x2="600" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#04121F" />
      <stop offset="50%" stop-color="#082338" />
      <stop offset="100%" stop-color="#020C14" />
    </linearGradient>
    <linearGradient id="swarm-node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="340" fill="url(#auto-bg)" />
  <path d="M40 50 H560 M40 110 H560 M40 170 H560 M40 230 H560" stroke="#0C344E" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Header -->
  <g transform="translate(45, 25)">
    <text x="0" y="14" fill="#67E8F9" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1">AGENT SWARM ARBITRAGE &amp; CORPORATE RESTRUCTURING</text>
    <text x="0" y="34" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Autonomous Workforce Valuation Re-rating Engine</text>
  </g>

  <!-- LEFT: SWARM TOPOLOGY NETWORK -->
  <g transform="translate(45, 75)">
    <rect x="0" y="0" width="245" height="175" rx="8" fill="#061B2B" stroke="#0E456B" stroke-width="1.2" />
    <text x="14" y="22" fill="#67E8F9" font-family="system-ui, sans-serif" font-size="10" font-weight="700">SWARM ORCHESTRATION TOPOLOGY</text>

    <!-- Network Lines -->
    <line x1="122" y1="95" x2="55" y2="60" stroke="#0891B2" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="122" y1="95" x2="190" y2="60" stroke="#0891B2" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="122" y1="95" x2="65" y2="140" stroke="#0891B2" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="122" y1="95" x2="180" y2="140" stroke="#0891B2" stroke-width="1.5" stroke-dasharray="3 3" />

    <!-- Center Master Orchestrator Node -->
    <circle cx="122" cy="95" r="22" fill="#083344" stroke="#06B6D4" stroke-width="2.5" filter="url(#cyan-glow)" />
    <text x="122" y="93" fill="#ECFEFF" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">SWARM</text>
    <text x="122" y="104" fill="#67E8F9" font-family="ui-monospace, monospace" font-size="7" text-anchor="middle">ROUTER</text>

    <!-- Node 1: Financial Modeling Agent -->
    <circle cx="55" cy="60" r="14" fill="#0E456B" stroke="#38BDF8" stroke-width="1.5" />
    <text x="55" y="63" fill="#FFF" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">FIN</text>

    <!-- Node 2: Ops & Customer Care Agent -->
    <circle cx="190" cy="60" r="14" fill="#0E456B" stroke="#38BDF8" stroke-width="1.5" />
    <text x="190" y="63" fill="#FFF" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">OPS</text>

    <!-- Node 3: Coding & Dev Agent -->
    <circle cx="65" cy="140" r="14" fill="#0E456B" stroke="#38BDF8" stroke-width="1.5" />
    <text x="65" y="143" fill="#FFF" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">DEV</text>

    <!-- Node 4: Sales Pipeline Agent -->
    <circle cx="180" cy="140" r="14" fill="#0E456B" stroke="#38BDF8" stroke-width="1.5" />
    <text x="180" y="143" fill="#FFF" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">SALES</text>
  </g>

  <!-- RIGHT: VALUATION RE-RATING DYNAMICS -->
  <g transform="translate(305, 75)">
    <rect x="0" y="0" width="245" height="175" rx="8" fill="#061B2B" stroke="#0E456B" stroke-width="1.2" />
    <text x="14" y="22" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10" font-weight="700">VALUATION RE-RATING (EBITDA EXPANSION)</text>

    <!-- Pre-restructuring Bar -->
    <g transform="translate(14, 40)">
      <text x="0" y="12" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Legacy Multiple (12× EV/EBITDA)</text>
      <rect x="0" y="18" width="110" height="18" rx="4" fill="#334155" />
      <text x="118" y="32" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" font-weight="700">₹144 Cr EV</text>
    </g>

    <!-- Autonomous Workforce Bar -->
    <g transform="translate(14, 88)">
      <text x="0" y="12" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Tech Autonomous Multiple (22× EV/EBITDA)</text>
      <rect x="0" y="18" width="185" height="22" rx="4" fill="url(#swarm-node)" filter="url(#cyan-glow)" />
      <text x="8" y="34" fill="#ECFEFF" font-family="system-ui, sans-serif" font-size="12" font-weight="800">₹425 Cr EV (+195%)</text>
    </g>

    <line x1="14" y1="140" x2="230" y2="140" stroke="#0E456B" stroke-width="1" />
    <text x="14" y="158" fill="#34D399" font-family="system-ui, sans-serif" font-size="10" font-weight="700">EBITDA Margin: 18% → 44% (+2,600 bps)</text>
  </g>

  <!-- Bottom Metric Callout -->
  <g transform="translate(45, 258)">
    <rect x="0" y="0" width="505" height="42" rx="6" fill="#041420" stroke="#0E456B" stroke-width="1" />
    <text x="20" y="18" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Severance Amortization Payoff</text>
    <text x="20" y="33" fill="#67E8F9" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Full Headcount Transition Recouped in 4.8 Months</text>

    <text x="330" y="18" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Sustainable Free Cash Flow</text>
    <text x="330" y="33" fill="#34D399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">+₹18.4 Cr / Year Recurring</text>
  </g>

  <!-- Footer -->
  <rect x="0" y="312" width="600" height="28" fill="#02080D" />
  <circle cx="20" cy="326" r="3.5" fill="#06B6D4" />
  <text x="32" y="330" fill="#64748B" font-family="ui-monospace, monospace" font-size="9">AUTONOMOUS WORKFORCE SIMULATOR // SWARM ARBITRAGE FINANCIAL SOLVER</text>
</svg>
