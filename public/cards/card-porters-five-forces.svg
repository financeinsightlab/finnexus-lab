<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="porter-bg" x1="0" y1="0" x2="600" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141006" />
      <stop offset="50%" stop-color="#241B08" />
      <stop offset="100%" stop-color="#0E0B03" />
    </linearGradient>
    <linearGradient id="radar-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.15" />
    </linearGradient>
    <filter id="amber-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="340" fill="url(#porter-bg)" />
  <path d="M40 50 H560 M40 110 H560 M40 170 H560 M40 230 H560" stroke="#3D2E0F" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Header -->
  <g transform="translate(45, 25)">
    <text x="0" y="14" fill="#FCD34D" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1">STRATEGIC COMPETITIVE POSITIONING</text>
    <text x="0" y="34" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Porter's Five Forces Radar Architecture</text>
  </g>

  <!-- RADAR PENTAGON GRAPH (Center at (200, 185)) -->
  <g transform="translate(190, 185)">
    <!-- Concentric Pentagon Level 1 (20) -->
    <polygon points="0,-25 24,-8 15,20 -15,20 -24,-8" stroke="#523E13" stroke-width="1" fill="none" />
    <!-- Concentric Pentagon Level 2 (50) -->
    <polygon points="0,-50 48,-15 30,40 -30,40 -48,-15" stroke="#785918" stroke-width="1" fill="none" />
    <!-- Concentric Pentagon Level 3 (80) -->
    <polygon points="0,-80 76,-25 47,65 -47,65 -76,-25" stroke="#A1771D" stroke-width="1.2" stroke-dasharray="3 3" fill="none" />

    <!-- 5 Radial Axes -->
    <line x1="0" y1="0" x2="0" y2="-90" stroke="#785918" stroke-width="1.2" />
    <line x1="0" y1="0" x2="85" y2="-28" stroke="#785918" stroke-width="1.2" />
    <line x1="0" y1="0" x2="52" y2="72" stroke="#785918" stroke-width="1.2" />
    <line x1="0" y1="0" x2="-52" y2="72" stroke="#785918" stroke-width="1.2" />
    <line x1="0" y1="0" x2="-85" y2="-28" stroke="#785918" stroke-width="1.2" />

    <!-- ACTIVE PROFILE POLYGON -->
    <polygon points="0,-72 68,-22 35,52 -40,48 -58,-19" fill="url(#radar-fill)" stroke="#F59E0B" stroke-width="2.5" filter="url(#amber-glow)" />

    <!-- Data Points & Labels on Vertexes -->
    <!-- Top: Rivalry -->
    <circle cx="0" cy="-72" r="4" fill="#FBBF24" />
    <text x="0" y="-98" fill="#FCD34D" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">RIVALRY (4.2)</text>

    <!-- Top Right: New Entrants -->
    <circle cx="68" cy="-22" r="4" fill="#FBBF24" />
    <text x="95" y="-24" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9" font-weight="600">ENTRANTS (3.8)</text>

    <!-- Bottom Right: Substitutes -->
    <circle cx="35" cy="52" r="4" fill="#FBBF24" />
    <text x="48" y="86" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9" font-weight="600">SUBSTITUTES (2.9)</text>

    <!-- Bottom Left: Supplier Power -->
    <circle cx="-40" cy="48" r="4" fill="#FBBF24" />
    <text x="-52" y="86" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="end">SUPPLIERS (2.6)</text>

    <!-- Top Left: Buyer Power -->
    <circle cx="-58" cy="-19" r="4" fill="#FBBF24" />
    <text x="-95" y="-24" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="end">BUYERS (3.4)</text>
  </g>

  <!-- RIGHT: Strategic Assessment Card -->
  <g transform="translate(370, 85)">
    <rect x="0" y="0" width="185" height="195" rx="8" fill="#1A1406" stroke="#45340C" stroke-width="1.2" />
    <text x="14" y="24" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="10" font-weight="700">INDUSTRY ASSESSMENT</text>
    <text x="14" y="44" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="800">High Competitive Intensity</text>

    <!-- Score Bar -->
    <text x="14" y="70" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Composite Threat Score</text>
    <rect x="14" y="78" width="157" height="8" rx="4" fill="#29200B" />
    <rect x="14" y="78" width="112" height="8" rx="4" fill="#F59E0B" />
    <text x="14" y="102" fill="#FCD34D" font-family="system-ui, sans-serif" font-size="12" font-weight="800">3.58 / 5.00</text>

    <!-- Key Takeaway -->
    <rect x="14" y="118" width="157" height="60" rx="6" fill="#29200B" stroke="#523E13" stroke-width="1" />
    <text x="22" y="136" fill="#FCD34D" font-family="system-ui, sans-serif" font-size="9" font-weight="700">STRATEGY IMPLICATION</text>
    <text x="22" y="152" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5">Protect pricing power via</text>
    <text x="22" y="166" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5">proprietary IP &amp; lock-in.</text>
  </g>

  <!-- Footer -->
  <rect x="0" y="312" width="600" height="28" fill="#080602" />
  <circle cx="20" cy="326" r="3.5" fill="#F59E0B" />
  <text x="32" y="330" fill="#64748B" font-family="ui-monospace, monospace" font-size="9">PORTER'S FIVE FORCES SIMULATOR // COMPETITIVE EQUILIBRIUM ENGINE</text>
</svg>
