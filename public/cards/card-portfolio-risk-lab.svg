<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="mpt-bg" x1="0" y1="0" x2="600" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0E23" />
      <stop offset="50%" stop-color="#141738" />
      <stop offset="100%" stop-color="#070918" />
    </linearGradient>
    <linearGradient id="frontier-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="40%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="mpt-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="340" fill="url(#mpt-bg)" />

  <!-- Background Financial Coordinates -->
  <path d="M40 50 H560 M40 100 H560 M40 150 H560 M40 200 H560 M40 250 H560" stroke="#1F244D" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6" />
  <path d="M90 40 V270 M170 40 V270 M250 40 V270 M330 40 V270 M410 40 V270 M490 40 V270" stroke="#1F244D" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Title -->
  <g transform="translate(45, 25)">
    <text x="0" y="14" fill="#818CF8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1">MARKOWITZ MODERN PORTFOLIO THEORY</text>
    <text x="0" y="34" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Two-Asset Efficient Frontier &amp; Risk Envelope</text>
  </g>

  <!-- GRAPH AREA: (X = Risk σ, Y = Expected Return E[R]) -->
  <g transform="translate(60, 40)">
    <!-- Axes -->
    <line x1="30" y1="230" x2="480" y2="230" stroke="#475569" stroke-width="1.4" />
    <line x1="30" y1="40" x2="30" y2="230" stroke="#475569" stroke-width="1.4" />
    <text x="460" y="246" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Risk (σp)</text>
    <text x="10" y="35" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">E[Rp]</text>

    <!-- Capital Allocation Line (CAL tangent) -->
    <line x1="30" y1="195" x2="440" y2="50" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.7" />
    <text x="35" y="190" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="9">Rf = 6.8%</text>

    <!-- Linear weighted line (rho = 1) -->
    <path d="M 120 180 Q 220 135 380 70" stroke="#475569" stroke-width="1" stroke-dasharray="2 2" fill="none" opacity="0.5" />

    <!-- MARKOWITZ CURVE (rho = 0.20 hyperbola) -->
    <path d="M 380 70 C 200 85, 110 110, 115 138 C 118 155, 180 170, 220 185" stroke="url(#frontier-glow)" stroke-width="3.5" fill="none" filter="url(#mpt-filter)" />
    <path d="M 380 70 C 200 85, 110 110, 115 138 C 118 155, 180 170, 220 185" stroke="url(#frontier-glow)" stroke-width="3" fill="none" />

    <!-- Asset A Point (High Return, High Risk) -->
    <circle cx="380" cy="70" r="6" fill="#38BDF8" />
    <circle cx="380" cy="70" r="3" fill="#FFFFFF" />
    <text x="395" y="70" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Asset A (Equities)</text>
    <text x="395" y="84" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">E[R]=16.5%, σ=22%</text>

    <!-- Asset B Point (Low Return, Lower Risk) -->
    <circle cx="220" cy="185" r="6" fill="#A855F7" />
    <circle cx="220" cy="185" r="3" fill="#FFFFFF" />
    <text x="235" y="185" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Asset B (Bonds)</text>
    <text x="235" y="199" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">E[R]=8.5%, σ=9%</text>

    <!-- MVP (Minimum Variance Portfolio) Node -->
    <circle cx="115" cy="138" r="8" fill="#F59E0B" filter="url(#mpt-filter)" />
    <circle cx="115" cy="138" r="4" fill="#FFFFFF" />
    <line x1="115" y1="138" x2="115" y2="230" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="3 3" />
    
    <!-- MVP Annotation Box -->
    <rect x="70" y="85" width="135" height="36" rx="6" fill="#1E1B4B" stroke="#F59E0B" stroke-width="1" />
    <text x="78" y="100" fill="#FCD34D" font-family="system-ui, sans-serif" font-size="9" font-weight="700">MIN VARIANCE (MVP)</text>
    <text x="78" y="114" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="800">σp = 7.4% (-34% risk)</text>
  </g>

  <!-- Interactive Parameter Pill -->
  <g transform="translate(410, 255)">
    <rect x="0" y="0" width="150" height="38" rx="8" fill="#181838" stroke="#6366F1" stroke-width="1" />
    <text x="12" y="16" fill="#A5B4FC" font-family="system-ui, sans-serif" font-size="9" font-weight="600">CORRELATION ρ</text>
    <text x="12" y="31" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="13" font-weight="800">ρ(A,B) = +0.15</text>
  </g>

  <!-- Bottom Terminal Status Bar -->
  <rect x="0" y="312" width="600" height="28" fill="#040612" />
  <circle cx="20" cy="326" r="3.5" fill="#818CF8" />
  <text x="32" y="330" fill="#64748B" font-family="ui-monospace, monospace" font-size="9">PORTFOLIO RISK LAB // QUADRATIC OPTIMIZATION &amp; SHARPE MAXIMIZER</text>
</svg>
