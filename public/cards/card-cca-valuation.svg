<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="cca-bg" x1="0" y1="0" x2="600" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080F24" />
      <stop offset="50%" stop-color="#101C3D" />
      <stop offset="100%" stop-color="#060A18" />
    </linearGradient>
    <linearGradient id="peer-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <linearGradient id="target-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
    <filter id="cca-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="340" fill="url(#cca-bg)" />
  <path d="M40 50 H560 M40 110 H560 M40 170 H560 M40 230 H560" stroke="#1E2C52" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Title -->
  <g transform="translate(45, 25)">
    <text x="0" y="14" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1">COMPARABLE COMPANY ANALYSIS (CCA)</text>
    <text x="0" y="34" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Peer Trading Multiples &amp; EV/EBITDA Benchmarks</text>
  </g>

  <!-- MULTIPLES COMPARISON BARS -->
  <g transform="translate(50, 75)">
    <!-- Peer 1 -->
    <g transform="translate(0, 0)">
      <text x="0" y="18" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Infosys Ltd</text>
      <rect x="110" y="5" width="220" height="18" rx="4" fill="url(#peer-bar)" />
      <text x="340" y="19" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" font-weight="700">18.4× EV/EBITDA</text>
    </g>

    <!-- Peer 2 -->
    <g transform="translate(0, 32)">
      <text x="0" y="18" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">TCS Ltd</text>
      <rect x="110" y="5" width="265" height="18" rx="4" fill="url(#peer-bar)" />
      <text x="385" y="19" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" font-weight="700">22.1× EV/EBITDA</text>
    </g>

    <!-- Peer 3 -->
    <g transform="translate(0, 64)">
      <text x="0" y="18" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Wipro</text>
      <rect x="110" y="5" width="168" height="18" rx="4" fill="url(#peer-bar)" />
      <text x="288" y="19" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" font-weight="700">14.0× EV/EBITDA</text>
    </g>

    <!-- SECTOR MEDIAN DOTTED BENCHMARK LINE -->
    <line x1="310" y1="-5" x2="310" y2="135" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 4" />
    <text x="315" y="130" fill="#FCD34D" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Sector Median: 16.8×</text>

    <!-- Peer 4 -->
    <g transform="translate(0, 96)">
      <text x="0" y="18" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">HCL Tech</text>
      <rect x="110" y="5" width="195" height="18" rx="4" fill="url(#peer-bar)" />
      <text x="315" y="19" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" font-weight="700">16.3× EV/EBITDA</text>
    </g>

    <!-- TARGET VALUATION BRIDGE (HIGHLIGHTED GREEN) -->
    <g transform="translate(0, 138)">
      <rect x="-10" y="-4" width="510" height="34" rx="6" fill="#042F2E" stroke="#0D9488" stroke-width="1.2" />
      <text x="5" y="18" fill="#2DD4BF" font-family="system-ui, sans-serif" font-size="12" font-weight="800">TARGET COMPANY</text>
      <rect x="110" y="4" width="202" height="18" rx="4" fill="url(#target-bar)" filter="url(#cca-glow)" />
      <text x="325" y="18" fill="#5EEAD4" font-family="system-ui, sans-serif" font-size="12" font-weight="800">16.8× Implied EV/EBITDA</text>
    </g>
  </g>

  <!-- Bottom DLOM & Metric Callout -->
  <g transform="translate(50, 258)">
    <rect x="0" y="0" width="500" height="42" rx="6" fill="#0C152E" stroke="#1E2C52" stroke-width="1" />
    <text x="20" y="18" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Discount for Lack of Marketability (DLOM)</text>
    <text x="20" y="32" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="700">15.0% Private Discount Applied to Equity Value</text>

    <text x="320" y="18" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Target Enterprise Value</text>
    <text x="320" y="32" fill="#2DD4BF" font-family="system-ui, sans-serif" font-size="13" font-weight="800">₹840 Cr Implied EV</text>
  </g>

  <!-- Footer -->
  <rect x="0" y="312" width="600" height="28" fill="#030611" />
  <circle cx="20" cy="326" r="3.5" fill="#3B82F6" />
  <text x="32" y="330" fill="#64748B" font-family="ui-monospace, monospace" font-size="9">COMPARABLE VALUATION BENCHMARK // MEDIAN &amp; INTERQUARTILE BRIDGE</text>
</svg>
