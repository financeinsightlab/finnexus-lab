<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="fall-bg" x1="0" y1="0" x2="600" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#081524" />
      <stop offset="50%" stop-color="#0F243B" />
      <stop offset="100%" stop-color="#050E17" />
    </linearGradient>
    <linearGradient id="chart-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="f-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="340" fill="url(#fall-bg)" />
  <path d="M40 50 H560 M40 100 H560 M40 150 H560 M40 200 H560 M40 250 H560" stroke="#163450" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6" />
  <path d="M90 40 V270 M170 40 V270 M250 40 V270 M330 40 V270 M410 40 V270 M490 40 V270" stroke="#163450" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Logo watermark -->
  <g transform="translate(45, 30)">
    <circle cx="12" cy="12" r="10" fill="#0D9488" opacity="0.8" />
    <path d="M7 12 L11 16 L17 8" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="30" y="16" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="800">KUNWAR ANALYTICS</text>
    <text x="175" y="16" fill="#2DD4BF" font-family="system-ui, sans-serif" font-size="12" font-weight="600">// FINANCIAL LAB</text>
  </g>

  <!-- Financial Chart Area -->
  <g transform="translate(50, 65)">
    <!-- Baseline Axis -->
    <line x1="20" y1="180" x2="500" y2="180" stroke="#475569" stroke-width="1.2" />

    <!-- Shaded Area Under Curve -->
    <path d="M 40 160 Q 120 150, 190 100 T 320 120 T 420 50 L 480 40 L 480 180 L 40 180 Z" fill="#0D9488" fill-opacity="0.12" />

    <!-- Dynamic Financial Trajectory Line -->
    <path d="M 40 160 Q 120 150, 190 100 T 320 120 T 420 50 L 480 40" stroke="url(#chart-glow)" stroke-width="3.5" fill="none" filter="url(#f-glow)" />
    <path d="M 40 160 Q 120 150, 190 100 T 320 120 T 420 50 L 480 40" stroke="url(#chart-glow)" stroke-width="2.5" fill="none" />

    <!-- Node Points -->
    <circle cx="190" cy="100" r="5" fill="#38BDF8" />
    <circle cx="320" cy="120" r="5" fill="#818CF8" />
    <circle cx="480" cy="40" r="6" fill="#2DD4BF" filter="url(#f-glow)" />
    <circle cx="480" cy="40" r="3" fill="#FFF" />

    <!-- Metric Callout -->
    <rect x="360" y="80" width="140" height="48" rx="6" fill="#0A1E30" stroke="#0D9488" stroke-width="1" />
    <text x="372" y="98" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" font-weight="600">QUANTITATIVE MODEL</text>
    <text x="372" y="116" fill="#2DD4BF" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Alpha Engine</text>
  </g>

  <!-- Status Footer -->
  <rect x="0" y="312" width="600" height="28" fill="#03080E" />
  <circle cx="20" cy="326" r="3.5" fill="#14B8A6" />
  <text x="32" y="330" fill="#64748B" font-family="ui-monospace, monospace" font-size="9">INSTITUTIONAL QUANTITATIVE RESEARCH // KUNWAR ANALYTICS</text>
</svg>
