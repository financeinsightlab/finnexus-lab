<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="ratio-bg" x1="0" y1="0" x2="600" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#08101E" />
      <stop offset="50%" stop-color="#0E1A30" />
      <stop offset="100%" stop-color="#050A14" />
    </linearGradient>
    <linearGradient id="dupont-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="dupont-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="dupont-emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="node-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="340" fill="url(#ratio-bg)" />
  <path d="M30 50 H570 M30 110 H570 M30 170 H570 M30 230 H570 M30 290 H570" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.5" />

  <!-- Title Banner -->
  <g transform="translate(40, 30)">
    <text x="0" y="14" fill="#64748B" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1">DUPONT IDENTITY &amp; FINANCIAL RATIOS</text>
    <text x="0" y="34" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="16" font-weight="700">3-Stage ROE Decomposition Matrix</text>
  </g>

  <!-- APEX: ROE Master Node -->
  <g transform="translate(230, 80)">
    <rect x="0" y="0" width="140" height="52" rx="8" fill="#1E293B" stroke="#0EA5E9" stroke-width="2" filter="url(#node-glow)" />
    <text x="70" y="22" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">RETURN ON EQUITY</text>
    <text x="70" y="42" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="20" font-weight="800" text-anchor="middle">ROE = 24.6%</text>
  </g>

  <!-- Connective Arrows -->
  <path d="M300 132 V155 M300 155 H130 V175 M300 155 H470 V175 M300 155 V175" stroke="#38BDF8" stroke-width="1.6" stroke-dasharray="3 3" opacity="0.8" />

  <!-- BRANCH 1: Net Margin (P&L) -->
  <g transform="translate(50, 175)">
    <rect x="0" y="0" width="155" height="60" rx="8" fill="#0F172A" stroke="#059669" stroke-width="1.4" />
    <text x="14" y="20" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="10" font-weight="700">1. NET PROFIT MARGIN</text>
    <text x="14" y="42" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="18" font-weight="800">14.2%</text>
    <text x="14" y="54" fill="#64748B" font-family="system-ui, sans-serif" font-size="9">Net Income / Revenue</text>
  </g>

  <!-- MULTIPLY ICON 1 -->
  <text x="218" y="210" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="18" font-weight="700">×</text>

  <!-- BRANCH 2: Asset Turnover (Efficiency) -->
  <g transform="translate(235, 175)">
    <rect x="0" y="0" width="145" height="60" rx="8" fill="#0F172A" stroke="#0284C7" stroke-width="1.4" />
    <text x="14" y="20" fill="#7DD3FC" font-family="system-ui, sans-serif" font-size="10" font-weight="700">2. ASSET TURNOVER</text>
    <text x="14" y="42" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="18" font-weight="800">1.18×</text>
    <text x="14" y="54" fill="#64748B" font-family="system-ui, sans-serif" font-size="9">Revenue / Total Assets</text>
  </g>

  <!-- MULTIPLY ICON 2 -->
  <text x="393" y="210" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="18" font-weight="700">×</text>

  <!-- BRANCH 3: Financial Leverage (Solvency) -->
  <g transform="translate(410, 175)">
    <rect x="0" y="0" width="150" height="60" rx="8" fill="#0F172A" stroke="#D97706" stroke-width="1.4" />
    <text x="14" y="20" fill="#FCD34D" font-family="system-ui, sans-serif" font-size="10" font-weight="700">3. EQUITY MULTIPLIER</text>
    <text x="14" y="42" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="18" font-weight="800">1.47×</text>
    <text x="14" y="54" fill="#64748B" font-family="system-ui, sans-serif" font-size="9">Total Assets / Equity</text>
  </g>

  <!-- BOTTOM METRICS BAR -->
  <g transform="translate(40, 250)">
    <rect x="0" y="0" width="520" height="46" rx="6" fill="#0B132B" stroke="#1E293B" stroke-width="1" />
    <text x="20" y="20" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Current Ratio</text>
    <text x="20" y="36" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700">2.34×</text>

    <line x1="120" y1="10" x2="120" y2="36" stroke="#1E293B" stroke-width="1" />
    <text x="140" y="20" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Quick Ratio</text>
    <text x="140" y="36" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700">1.68×</text>

    <line x1="240" y1="10" x2="240" y2="36" stroke="#1E293B" stroke-width="1" />
    <text x="260" y="20" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Interest Coverage</text>
    <text x="260" y="36" fill="#34D399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">5.82×</text>

    <line x1="380" y1="10" x2="380" y2="36" stroke="#1E293B" stroke-width="1" />
    <text x="400" y="20" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Cash Cycle (CCC)</text>
    <text x="400" y="36" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">38.4 Days</text>
  </g>

  <!-- Status Footer -->
  <rect x="0" y="312" width="600" height="28" fill="#030712" />
  <circle cx="20" cy="326" r="3.5" fill="#38BDF8" />
  <text x="32" y="330" fill="#64748B" font-family="ui-monospace, monospace" font-size="9">18 AUDITED FINANCIAL RATIOS // DUPONT PYRAMID SOLVER</text>
</svg>
