<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Five step practical framework to start using your data">
  <rect width="1000" height="560" fill="#0B1C2C"/>
  <text x="500" y="46" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#ffffff" font-weight="bold">How to Start Using Your Data — A 5-Step Framework</text>
  <g font-family="Arial, sans-serif">
    <!-- Step 1 -->
    <g transform="translate(60,90)">
      <circle cx="40" cy="40" r="40" fill="#0D6E6E"/>
      <text x="40" y="48" text-anchor="middle" font-size="26" fill="#ffffff" font-weight="bold">1</text>
      <text x="100" y="34" font-size="16" fill="#ffffff" font-weight="bold">Define 3 questions</text>
      <text x="100" y="56" font-size="12" fill="#7fa8a8">you can't currently answer</text>
      <text x="100" y="74" font-size="12" fill="#7fa8a8">e.g. "Which customers haven't</text>
      <text x="100" y="90" font-size="12" fill="#7fa8a8">ordered in 90 days?"</text>
    </g>
    <!-- arrow -->
    <g transform="translate(330,130)"><polygon points="0,0 18,8 0,16" fill="#0F9E9E"/></g>
    <!-- Step 2 -->
    <g transform="translate(360,90)">
      <circle cx="40" cy="40" r="40" fill="#0D6E6E"/>
      <text x="40" y="48" text-anchor="middle" font-size="26" fill="#ffffff" font-weight="bold">2</text>
      <text x="100" y="34" font-size="16" fill="#ffffff" font-weight="bold">Audit your data</text>
      <text x="100" y="56" font-size="12" fill="#7fa8a8">List every system, file, owner</text>
      <text x="100" y="74" font-size="12" fill="#7fa8a8">Assess quality: complete?</text>
      <text x="100" y="90" font-size="12" fill="#7fa8a8">current? consistent?</text>
    </g>
    <g transform="translate(630,130)"><polygon points="0,0 18,8 0,16" fill="#0F9E9E"/></g>
    <!-- Step 3 -->
    <g transform="translate(660,90)">
      <circle cx="40" cy="40" r="40" fill="#c9a64f"/>
      <text x="40" y="48" text-anchor="middle" font-size="26" fill="#ffffff" font-weight="bold">3</text>
      <text x="100" y="34" font-size="16" fill="#ffffff" font-weight="bold">Clean before analyze</text>
      <text x="100" y="56" font-size="12" fill="#7fa8a8">Standardize formats</text>
      <text x="100" y="74" font-size="12" fill="#7fa8a8">Fill gaps, remove dupes</text>
      <text x="100" y="90" font-size="12" fill="#7fa8a8">~60–70% of project time</text>
    </g>
    <!-- Step 4 -->
    <g transform="translate(60,300)">
      <circle cx="40" cy="40" r="40" fill="#0D6E6E"/>
      <text x="40" y="48" text-anchor="middle" font-size="26" fill="#ffffff" font-weight="bold">4</text>
      <text x="100" y="34" font-size="16" fill="#ffffff" font-weight="bold">Build ONE dashboard</text>
      <text x="100" y="56" font-size="12" fill="#7fa8a8">Answers your 3 questions</text>
      <text x="100" y="74" font-size="12" fill="#7fa8a8">Visual, simple, weekly-reviewed</text>
      <text x="100" y="90" font-size="12" fill="#7fa8a8">A used dashboard > 10 ignored ones</text>
    </g>
    <g transform="translate(330,340)"><polygon points="0,0 18,8 0,16" fill="#0F9E9E"/></g>
    <!-- Step 5 -->
    <g transform="translate(360,300)">
      <circle cx="40" cy="40" r="40" fill="#0F9E9E"/>
      <text x="40" y="48" text-anchor="middle" font-size="26" fill="#ffffff" font-weight="bold">5</text>
      <text x="100" y="34" font-size="16" fill="#ffffff" font-weight="bold">Decide · Measure · Repeat</text>
      <text x="100" y="56" font-size="12" fill="#7fa8a8">Make 1 decision from data</text>
      <text x="100" y="74" font-size="12" fill="#7fa8a8">Track 30/60/90 days</text>
      <text x="100" y="90" font-size="12" fill="#7fa8a8">Prove ROI → justify next step</text>
    </g>
    <!-- loop arrow back to step 1 -->
    <g transform="translate(660,340)">
      <path d="M 0 0 Q 120 0 120 60 Q 120 120 60 120 Q 0 120 0 60 Z" fill="none" stroke="#0F9E9E" stroke-width="2" stroke-dasharray="5,4"/>
      <text x="60" y="70" text-anchor="middle" font-size="12" fill="#0F9E9E" font-weight="bold">iterate</text>
    </g>
  </g>
  <text x="500" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold">The goal isn't dashboards. It's better decisions.</text>
  <text x="500" y="528" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5b7a8c">Start small. Prove value. Then scale.</text>
</svg>
