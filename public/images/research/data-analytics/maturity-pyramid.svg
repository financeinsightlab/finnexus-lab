<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="Analytics Maturity Model pyramid for Indian businesses">
  <rect width="900" height="600" fill="#0B1C2C"/>
  <text x="450" y="46" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#ffffff" font-weight="bold">Analytics Maturity Model — Indian Businesses</text>
  <!-- pyramid layers (bottom to top) -->
  <g font-family="Arial, sans-serif">
    <!-- L1 -->
    <polygon points="120,520 780,520 720,440 180,440" fill="#7a2e2e"/>
    <text x="450" y="478" text-anchor="middle" font-size="16" fill="#ffffff" font-weight="bold">Level 1 · Data Chaos</text>
    <text x="450" y="500" text-anchor="middle" font-size="13" fill="#ffd9d9">~55% of Indian SMEs</text>
    <!-- L2 -->
    <polygon points="180,440 720,440 660,360 240,360" fill="#c9774f"/>
    <text x="450" y="398" text-anchor="middle" font-size="16" fill="#ffffff" font-weight="bold">Level 2 · Basic Reporting</text>
    <text x="450" y="420" text-anchor="middle" font-size="13" fill="#ffe9d6">~30% of Indian SMEs</text>
    <!-- L3 -->
    <polygon points="240,360 660,360 600,280 300,280" fill="#c9a64f"/>
    <text x="450" y="318" text-anchor="middle" font-size="16" fill="#ffffff" font-weight="bold">Level 3 · Structured Analytics</text>
    <text x="450" y="340" text-anchor="middle" font-size="13" fill="#fff3d6">~10% of Indian SMEs</text>
    <!-- L4 -->
    <polygon points="300,280 600,280 540,200 360,200" fill="#0D6E6E"/>
    <text x="450" y="238" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="bold">Level 4 · Predictive</text>
    <text x="450" y="260" text-anchor="middle" font-size="13" fill="#c2e8e8">~4%</text>
    <!-- L5 -->
    <polygon points="360,200 540,200 450,120" fill="#0F9E9E"/>
    <text x="450" y="172" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="bold">Level 5</text>
    <text x="450" y="190" text-anchor="middle" font-size="12" fill="#e2f7f7">~1%</text>
  </g>
  <!-- annotation arrow -->
  <g>
    <path d="M 820 470 Q 860 470 860 400 Q 860 320 820 300" fill="none" stroke="#0F9E9E" stroke-width="2" stroke-dasharray="5,4"/>
    <text x="855" y="390" text-anchor="end" font-family="Arial" font-size="12" fill="#0F9E9E" font-weight="bold">Highest-ROI move:</text>
    <text x="855" y="408" text-anchor="end" font-family="Arial" font-size="12" fill="#0F9E9E">Level 2 → Level 3</text>
  </g>
  <text x="450" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5b7a8c">Don't try to jump from Level 1 to Level 4. Climb one rung at a time.</text>
</svg>
