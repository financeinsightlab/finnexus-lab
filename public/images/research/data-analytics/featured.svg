<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Indian Businesses Data Analytics Revenue Loss — Research Report">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1C2C"/>
      <stop offset="1" stop-color="#1A2B3C"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0D6E6E"/>
      <stop offset="1" stop-color="#0F9E9E"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- decorative grid -->
  <g stroke="#0D6E6E" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="473" x2="1200" y2="473"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>
  <!-- left: chaotic spreadsheet -->
  <g transform="translate(70,150)">
    <rect x="0" y="0" width="360" height="330" rx="14" fill="#0F2335" stroke="#1f3a4d"/>
    <text x="20" y="34" font-family="Georgia, serif" font-size="16" fill="#5b7a8c">sales_2022_final.xlsx</text>
    <g font-family="monospace" font-size="13" fill="#3d5a6c">
      <text x="20" y="70">A1  B2  C3  #REF  D4</text>
      <text x="20" y="96">??  4500  ???  1200</text>
      <text x="20" y="122">7800  #N/A  900  3300</text>
      <text x="20" y="148">2200  1100  ???  #DIV/0</text>
      <text x="20" y="174">???  5600  7700  8800</text>
      <text x="20" y="200">#VALUE  9900  ???  4400</text>
      <text x="20" y="226">3300  2200  1100  ???</text>
    </g>
    <text x="20" y="290" font-family="Georgia, serif" font-size="14" fill="#c9774f" font-style="italic">7 computers · 3 versions · 0 answers</text>
  </g>
  <!-- arrow -->
  <g transform="translate(470,300)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="url(#teal)" stroke-width="6" stroke-linecap="round"/>
    <polygon points="80,-14 110,0 80,14" fill="#0F9E9E"/>
    <text x="10" y="-22" font-family="Arial, sans-serif" font-size="13" fill="#0F9E9E" font-weight="bold">ANALYTICS</text>
  </g>
  <!-- right: clean dashboard -->
  <g transform="translate(600,150)">
    <rect x="0" y="0" width="530" height="330" rx="14" fill="#0F2335" stroke="#0D6E6E" stroke-opacity="0.4"/>
    <text x="20" y="34" font-family="Arial, sans-serif" font-size="15" fill="#0F9E9E" font-weight="bold">Revenue Intelligence Dashboard</text>
    <!-- KPI cards -->
    <g>
      <rect x="20" y="56" width="150" height="70" rx="10" fill="#0D6E6E" fill-opacity="0.15"/>
      <text x="34" y="80" font-family="Arial" font-size="11" fill="#7fa8a8">RECOVERED</text>
      <text x="34" y="108" font-family="Arial" font-size="22" fill="#ffffff" font-weight="bold">₹60L</text>
      <rect x="190" y="56" width="150" height="70" rx="10" fill="#0D6E6E" fill-opacity="0.15"/>
      <text x="204" y="80" font-family="Arial" font-size="11" fill="#7fa8a8">MARGIN</text>
      <text x="204" y="108" font-family="Arial" font-size="22" fill="#ffffff" font-weight="bold">13.5%</text>
      <rect x="360" y="56" width="150" height="70" rx="10" fill="#0D6E6E" fill-opacity="0.15"/>
      <text x="374" y="80" font-family="Arial" font-size="11" fill="#7fa8a8">CHURN RISK</text>
      <text x="374" y="108" font-family="Arial" font-size="22" fill="#ffffff" font-weight="bold">-31%</text>
    </g>
    <!-- bar chart -->
    <g transform="translate(20,150)">
      <line x1="0" y1="150" x2="490" y2="150" stroke="#1f3a4d"/>
      <rect x="10" y="60" width="50" height="90" fill="#0D6E6E"/>
      <rect x="80" y="90" width="50" height="60" fill="#0F9E9E"/>
      <rect x="150" y="40" width="50" height="110" fill="#0D6E6E"/>
      <rect x="220" y="100" width="50" height="50" fill="#0F9E9E"/>
      <rect x="290" y="30" width="50" height="120" fill="#0D6E6E"/>
      <rect x="360" y="75" width="50" height="75" fill="#0F9E9E"/>
      <rect x="430" y="50" width="50" height="100" fill="#0D6E6E"/>
    </g>
  </g>
  <!-- title -->
  <text x="600" y="540" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#ffffff" font-weight="bold">How Indian Businesses Lose Crores Ignoring Data</text>
  <text x="600" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0F9E9E" letter-spacing="3">RESEARCH REPORT · KUNWAR ANALYTICS</text>
</svg>
