<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="ROI of data analytics by investment level">
  <rect width="1000" height="560" fill="#0B1C2C"/>
  <text x="500" y="46" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#ffffff" font-weight="bold">The ROI of Data Analytics — What to Realistically Expect</text>
  <g font-family="Arial, sans-serif">
    <!-- axes -->
    <line x1="120" y1="460" x2="920" y2="460" stroke="#3d5a6c" stroke-width="2"/>
    <line x1="120" y1="100" x2="120" y2="460" stroke="#3d5a6c" stroke-width="2"/>
    <text x="520" y="510" text-anchor="middle" font-size="13" fill="#7fa8a8">Investment Level</text>
    <text x="60" y="280" text-anchor="middle" font-size="13" fill="#7fa8a8" transform="rotate(-90 60 280)">First-Year ROI Range</text>
    <!-- y labels -->
    <g font-size="12" fill="#7fa8a8">
      <text x="110" y="464" text-anchor="end">0%</text>
      <text x="110" y="394" text-anchor="end">200%</text>
      <text x="110" y="324" text-anchor="end">400%</text>
      <text x="110" y="254" text-anchor="end">600%</text>
      <text x="110" y="184" text-anchor="end">800%</text>
      <text x="110" y="114" text-anchor="end">1000%</text>
    </g>
    <!-- gridlines -->
    <g stroke="#1f3a4d" stroke-dasharray="3,4">
      <line x1="120" y1="390" x2="920" y2="390"/>
      <line x1="120" y1="320" x2="920" y2="320"/>
      <line x1="120" y1="250" x2="920" y2="250"/>
      <line x1="120" y1="180" x2="920" y2="180"/>
      <line x1="120" y1="110" x2="920" y2="110"/>
    </g>
    <!-- Low investment: 300-1000% -->
    <g transform="translate(220,0)">
      <rect x="0" y="110" width="120" height="350" fill="#0D6E6E" fill-opacity="0.35"/>
      <rect x="0" y="390" width="120" height="70" fill="#0D6E6E" fill-opacity="0.6"/>
      <line x1="0" y1="110" x2="120" y2="110" stroke="#0F9E9E" stroke-width="3"/>
      <line x1="0" y1="390" x2="120" y2="390" stroke="#0F9E9E" stroke-width="3"/>
      <text x="60" y="490" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">₹50K–₹2L</text>
      <text x="60" y="528" text-anchor="middle" font-size="11" fill="#0F9E9E">300–1000%</text>
      <text x="60" y="544" text-anchor="middle" font-size="10" fill="#7fa8a8">break-even 60–90d</text>
    </g>
    <!-- Medium investment: 200-500% -->
    <g transform="translate(440,0)">
      <rect x="0" y="320" width="120" height="140" fill="#c9a64f" fill-opacity="0.35"/>
      <rect x="0" y="390" width="120" height="70" fill="#c9a64f" fill-opacity="0.6"/>
      <line x1="0" y1="320" x2="120" y2="320" stroke="#c9a64f" stroke-width="3"/>
      <line x1="0" y1="390" x2="120" y2="390" stroke="#c9a64f" stroke-width="3"/>
      <text x="60" y="490" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">₹2L–₹10L</text>
      <text x="60" y="528" text-anchor="middle" font-size="11" fill="#c9a64f">200–500%</text>
      <text x="60" y="544" text-anchor="middle" font-size="10" fill="#7fa8a8">break-even 90–180d</text>
    </g>
    <!-- High investment: 150-400% -->
    <g transform="translate(660,0)">
      <rect x="0" y="360" width="120" height="100" fill="#c9774f" fill-opacity="0.35"/>
      <rect x="0" y="390" width="120" height="70" fill="#c9774f" fill-opacity="0.6"/>
      <line x1="0" y1="360" x2="120" y2="360" stroke="#c9774f" stroke-width="3"/>
      <line x1="0" y1="390" x2="120" y2="390" stroke="#c9774f" stroke-width="3"/>
      <text x="60" y="490" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">₹10L+</text>
      <text x="60" y="528" text-anchor="middle" font-size="11" fill="#c9774f">150–400%</text>
      <text x="60" y="544" text-anchor="middle" font-size="10" fill="#7fa8a8">break-even 6–18mo</text>
    </g>
    <!-- legend -->
    <g transform="translate(120,80)">
      <rect x="0" y="0" width="14" height="14" fill="#0D6E6E" fill-opacity="0.6"/>
      <text x="22" y="12" font-size="12" fill="#7fa8a8">Low investment</text>
      <rect x="140" y="0" width="14" height="14" fill="#c9a64f" fill-opacity="0.6"/>
      <text x="162" y="12" font-size="12" fill="#7fa8a8">Medium</text>
      <rect x="250" y="0" width="14" height="14" fill="#c9774f" fill-opacity="0.6"/>
      <text x="272" y="12" font-size="12" fill="#7fa8a8">High</text>
    </g>
  </g>
</svg>
